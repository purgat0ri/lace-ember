<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="icon" href="img/sigil.svg" type="image/svg+xml">
<style>
/* Lace & Ember start page. Fonts are the locally installed ones (brew casks). */
:root {
  --ink: #0b0709; --crimson: #b3263a; --ember: #ff7a3d; --gold: #c9a45c;
  --bone: #ede3d1; --ash: #b9b0b8; --glow: rgba(179, 38, 58, 0.6);
  --display: Cinzel, serif; --ui: "Inter Tight", -apple-system, sans-serif; --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--bone); font-family: var(--ui); overflow: hidden; }
.bg { position: fixed; inset: 0; background: url("img/storm-clean.jpg") center / cover no-repeat; filter: blur(1.5px) brightness(.5) saturate(1.1); transform: scale(1.02); }
.shade { position: fixed; inset: 0; background: linear-gradient(90deg, rgba(11,7,9,.62) 0%, rgba(11,7,9,.3) 45%, rgba(11,7,9,0) 68%); }
.figure { position: fixed; right: 4%; bottom: -1%; height: 97vh; filter: drop-shadow(0 0 30px rgba(179,38,58,.5)) drop-shadow(0 0 2px rgba(0,0,0,.9)); pointer-events: none; user-select: none; }
.embers { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.embers i { position: absolute; bottom: -10px; border-radius: 50%; background: #ffb27a; box-shadow: 0 0 6px 2px rgba(255,122,61,.75); animation: rise linear infinite; }
@keyframes rise { 0% { transform: translate(0,0); opacity: 0 } 10% { opacity: 1 } 100% { transform: translate(14px,-104vh); opacity: 0 } }

main { position: relative; height: 100%; width: 60%; min-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding: 40px; }
.lbl { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.hour { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.clock { font-family: var(--display); font-weight: 500; font-size: 104px; line-height: .95; letter-spacing: .02em; text-shadow: 0 0 30px var(--glow); }
.date { display: flex; align-items: center; gap: 14px; margin-top: 4px; font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; }
.date i { width: 70px; height: 1px; background: linear-gradient(90deg, rgba(201,164,92,0), var(--gold)); }
.date i:last-child { background: linear-gradient(90deg, var(--gold), rgba(201,164,92,0)); }

.blk { position: relative; background: rgba(13,8,10,.82); border: 1px solid rgba(237,227,209,.42); outline: 1px solid rgba(0,0,0,.85);
  box-shadow: 0 0 0 4px rgba(10,6,8,.32), 0 16px 40px -12px var(--glow), inset 0 1px 0 rgba(237,227,209,.07); }
.blk::before { content: ""; position: absolute; inset: 5px; pointer-events: none; opacity: .85; background:
  linear-gradient(var(--gold),var(--gold)) top left/12px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) top left/1px 12px no-repeat,
  linear-gradient(var(--gold),var(--gold)) top right/12px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) top right/1px 12px no-repeat,
  linear-gradient(var(--gold),var(--gold)) bottom left/12px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) bottom left/1px 12px no-repeat,
  linear-gradient(var(--gold),var(--gold)) bottom right/12px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) bottom right/1px 12px no-repeat; }
.pin::after { content: ""; position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; transform: translateX(-50%) rotate(45deg); background: #0d080a; border: 1px solid var(--gold); box-shadow: 0 0 8px rgba(255,122,61,.5); }

form.search { width: min(620px, 100%); height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 20px; }
form.search:focus-within { box-shadow: 0 0 0 4px rgba(10,6,8,.32), 0 16px 46px -10px rgba(255,122,61,.55); }
form.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--bone); font: 16px var(--ui); }
form.search input::placeholder { color: var(--ash); }
.kbd { font: 11px var(--mono); color: var(--ash); }

.sites { display: flex; gap: clamp(14px, 1.6vw, 28px); flex-wrap: wrap; justify-content: center; }
.site { display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none; color: var(--bone); }
.tile { width: clamp(60px, 5vw, 74px); height: clamp(60px, 5vw, 74px); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(237,227,209,.3); background: rgba(13,8,10,.75); outline: 1px solid #000;
  font: 700 22px var(--display); transition: transform .18s, box-shadow .18s; }
.site:hover .tile, .site:focus-visible .tile { transform: translateY(-4px); box-shadow: 0 12px 26px -10px var(--glow), 0 0 0 1px rgba(237,227,209,.6); }
.site span.lbl { color: var(--bone); font-size: 10px; }
.site:focus-visible { outline: none; }

figure[hidden] { display: none; }
figure { margin: 10px 0 0; max-width: 560px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
blockquote { margin: 0; font-family: var(--display); font-size: 15px; line-height: 1.6; }
figcaption { font-size: 11.5px; color: var(--ash); }
@media (max-width: 1100px) { .figure { opacity: .35; } main { width: 100%; min-width: 0; } }
@media (prefers-reduced-motion: reduce) { .embers { display: none; } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="shade"></div>
<div class="embers" id="embers" aria-hidden="true"></div>
<img class="figure" src="img/naamah-prowl.webp" alt="">

<main>
  <div class="hour">
    <span class="lbl">The hour</span>
    <span class="clock" id="clock"></span>
    <div class="date"><i></i><span id="date"></span><i></i></div>
  </div>

  <form class="search blk pin" action="https://kagi.com/search" method="get" role="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9a45c" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search with Kagi</label>
    <input id="q" name="q" placeholder="Search with Kagi" autocomplete="off" autofocus>
    <span class="kbd">⏎</span>
  </form>

  <nav class="sites" id="sites" aria-label="Sites"></nav>

  <figure id="codex" hidden>
    <span class="lbl">From the codex</span>
    <blockquote id="codex-text"></blockquote>
    <figcaption id="codex-src"></figcaption>
  </figure>
</main>

<script src="sites.js"></script>
<script src="codex-pool.js"></script>
<script src="newtab.js"></script>
</body>
</html>
