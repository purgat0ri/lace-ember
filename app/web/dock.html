<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lace.css">
<style>
/* the window is sized to the dock plus room for the lift, the pin and the glow */
body { display: flex; justify-content: center; align-items: flex-end; height: 100vh; }
.wrap { padding: 48px 30px 16px; }
.dock { display: flex; align-items: center; gap: 12px; padding: 12px 18px; }
.dock.flare { animation: flare 0.45s ease-out both; }
.item { position: relative; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(237, 227, 209, 0.22); background: rgba(20, 12, 15, 0.7);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s; }
.item img { width: 36px; height: 36px; filter: grayscale(1) sepia(.45) saturate(1.6) hue-rotate(-28deg) brightness(.92) contrast(1.08);
  transition: filter .25s ease; }
.item:hover { transform: translateY(-6px); border-color: rgba(237, 227, 209, .6); box-shadow: 0 10px 22px -6px var(--glow); }
.item:hover img, .item.front img { filter: none; }
.item.front { border-color: rgba(237, 227, 209, .55); box-shadow: 0 0 0 1px rgba(237, 227, 209, .25), 0 0 16px -2px var(--glow); }
/* window pips under the tile: one ember diamond per window on this Space (up
   to three); a hollow one when the app runs with no window here */
.pips { position: absolute; bottom: -11px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; pointer-events: none; }
.pips i { width: 5px; height: 5px; transform: rotate(45deg); background: var(--ember); box-shadow: 0 0 7px var(--ember); }
.pips i.none { background: transparent; box-shadow: inset 0 0 0 1px rgba(255, 122, 61, .8); }
.item.hidden img { opacity: .45; }
/* a minimised window: its app icon in a smaller, gold-edged frame */
.item.min { width: 40px; height: 40px; border-color: rgba(201, 164, 92, .5); background: rgba(13, 8, 10, .85); }
.item.min img { width: 28px; height: 28px; filter: grayscale(1) sepia(.5) brightness(.75); }
.item.min::before { content: ""; position: absolute; inset: 3px; border: 1px dashed rgba(201, 164, 92, .35); pointer-events: none; }
.tip { position: absolute; bottom: 60px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; left: 50%; transform: translateX(-50%) translateY(4px); opacity: 0; pointer-events: none;
  white-space: nowrap; font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  color: var(--bone); background: rgba(13, 8, 10, .92); border: 1px solid rgba(201, 164, 92, .6); padding: 4px 9px;
  transition: opacity .15s, transform .15s; }
.item:hover .tip { opacity: 1; transform: translateX(-50%); }
/* a live window: its app icon; the focused window gets an ember underline */
.item.win.front::after { content: ""; position: absolute; bottom: -9px; left: 12px; right: 12px; height: 2px;
  background: var(--ember); box-shadow: 0 0 8px var(--ember); }
.tip small { display: block; margin-top: 2px; font-family: var(--ui); font-size: 10px; font-weight: 400;
  letter-spacing: .04em; text-transform: none; color: var(--ash); }
.empty { font-family: var(--display); font-size: 10.5px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase;
  color: rgba(201, 164, 92, .75); padding: 14px 10px; }
.sep { width: 1px; height: 30px; background: rgba(201, 164, 92, .5); }
</style>
</head>
<body>
<div class="wrap" id="wrap"><nav class="dock blk pin" id="dock" aria-label="Dock"></nav></div>
<script>
const post = (m) => window.webkit && webkit.messageHandlers.lace.postMessage(m);
const dock = document.getElementById("dock");
let lastKey = "";
function report() {
  const r = document.getElementById("wrap").getBoundingClientRect();
  post({ type: "size", w: r.width, h: r.height });
}
window.lace = {
  update(s) {
    const key = JSON.stringify(s.items.map((i) => [i.id, i.token, i.name, i.running, i.front, i.wins, i.hidden, !!i.sep]));
    if (key === lastKey) return;
    lastKey = key;
    dock.innerHTML = "";
    if (!s.items.length) {
      const e = document.createElement("span"); e.className = "empty"; e.textContent = "No windows here";
      dock.appendChild(e);
    }
    s.items.forEach((it) => {
      if (it.sep) { const d = document.createElement("span"); d.className = "sep"; dock.appendChild(d); return; }
      const b = document.createElement("button");
      b.className = "item" + (it.win ? " win" : "") + (it.min ? " min" : "") + (it.running ? " running" : "") +
        (it.front ? " front" : "") + (it.hidden ? " hidden" : "");
      b.setAttribute("aria-label", it.name);
      b.innerHTML = `<img alt="" src="${it.icon}"><span class="tip"></span>`;
      b.querySelector(".tip").textContent = it.name;
      if (it.win && it.app && it.app !== it.name) {
        const sm = document.createElement("small"); sm.textContent = it.app; b.querySelector(".tip").appendChild(sm);
      }
      if (it.win) {
        b.onclick = () => post({ type: "restore", token: it.token });
        b.oncontextmenu = (e) => { e.preventDefault(); post({ type: "menu", id: it.id }); };
      } else if (it.min) {
        b.onclick = () => post({ type: "restore", token: it.token });
      } else {
        b.onclick = () => post({ type: "open", id: it.id });
        b.oncontextmenu = (e) => { e.preventDefault(); if (it.running) post({ type: "menu", id: it.id }); };
        if (it.running) {
          const p = document.createElement("span"); p.className = "pips";
          const n = Math.min(it.wins, 3);
          p.innerHTML = n ? "<i></i>".repeat(n) : '<i class="none"></i>';
          b.appendChild(p);
        }
      }
      dock.appendChild(b);
    });
    requestAnimationFrame(report);
  },
  shown(on) {
    if (!on) return;
    dock.classList.remove("flare"); void dock.offsetWidth; dock.classList.add("flare");
  },
};
</script>
</body>
</html>
