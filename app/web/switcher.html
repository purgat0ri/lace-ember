<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lace.css">
<style>
/* The ⌘Tab switcher: one block in the middle of the screen, a tile per
   window, the chosen one lifted in gold with its title below in Cinzel. */
body { display: flex; align-items: center; justify-content: center; height: 100vh; }
.sw { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 26px 30px 20px;
  max-width: 82vw; animation: rise .16s ease-out both; }
.kicker { font-family: var(--display); font-size: 10px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase;
  color: rgba(201, 164, 92, .8); display: flex; align-items: center; gap: 12px; }
.kicker::before, .kicker::after { content: ""; width: 46px; height: 1px;
  background: linear-gradient(90deg, rgba(201, 164, 92, 0), rgba(201, 164, 92, .7)); }
.kicker::after { transform: scaleX(-1); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.tile { position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(237, 227, 209, .2); background: rgba(20, 12, 15, .7);
  transition: transform .14s ease, border-color .14s, box-shadow .14s, background .14s; }
.tile img { width: 60px; height: 60px; transition: filter .14s;
  filter: grayscale(1) sepia(.45) saturate(1.6) hue-rotate(-28deg) brightness(.85) contrast(1.08); }
.tile .n { position: absolute; top: 4px; left: 6px; font-family: var(--display); font-size: 9px; font-weight: 700;
  letter-spacing: .04em; color: rgba(201, 164, 92, .55); }
.tile.hidden img { opacity: .45; }
.tile.min { border-style: dashed; border-color: rgba(201, 164, 92, .4); }
.tile.min img { width: 46px; height: 46px; }
.tile.sel { transform: translateY(-6px); border-color: var(--gold); background: rgba(179, 38, 58, .22);
  box-shadow: 0 0 0 1px #000, 0 0 0 4px rgba(10, 6, 8, .4), 0 14px 30px -8px var(--glow); }
.tile.sel img { filter: none; opacity: 1; }
.tile.sel .n { color: var(--gold); }
.tile.sel::after { content: ""; position: absolute; bottom: -12px; left: 50%; width: 7px; height: 7px;
  transform: translateX(-50%) rotate(45deg); background: var(--ember); box-shadow: 0 0 10px var(--ember); }
.caption { text-align: center; min-height: 40px; max-width: 70vw; }
.caption .t { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: .06em; color: var(--bone);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caption .a { margin-top: 3px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ash); }
@keyframes rise { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="sw blk pin" id="sw">
  <div class="kicker">Windows</div>
  <div class="tiles" id="tiles"></div>
  <div class="caption"><div class="t" id="t"></div><div class="a" id="a"></div></div>
</div>
<script>
const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX"];
let items = [];
const $ = (id) => document.getElementById(id);
window.lace = {
  update(s) {
    items = s.items || [];
    const box = $("tiles"); box.innerHTML = "";
    items.forEach((it, i) => {
      const d = document.createElement("div");
      d.className = "tile" + (it.min ? " min" : "") + (it.hidden ? " hidden" : "");
      d.innerHTML = `<img alt="" src="${it.icon}"><span class="n">${ROMAN[i] || ""}</span>`;
      box.appendChild(d);
    });
    const sw = $("sw"); sw.style.animation = "none"; void sw.offsetWidth; sw.style.animation = "";
    this.select(s.sel || 0);
  },
  select(i) {
    document.querySelectorAll(".tile").forEach((t, j) => t.classList.toggle("sel", j === i));
    const it = items[i];
    $("t").textContent = it ? it.name : "";
    $("a").textContent = it ? (it.min ? `${it.app} · minimised` : it.app) : "";
  },
};
</script>
</body>
</html>
